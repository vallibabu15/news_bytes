<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NB - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .admin-card { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #ff0000; }
        .header h2 { color: #ff0000; text-align: center; margin: 0 0 20px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #444; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        textarea { height: 100px; resize: none; }
        .toolbar { margin-bottom: 5px; }
        .tool-btn { background: #0044ff; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .post-btn { background: #ff0000; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .post-btn:disabled { background: #ccc; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="admin-card">
        <div class="header"><h2>NB Admin</h2></div>
        <div class="form-group"><label>మీడియా ఫైల్ (Photo/Video)</label><input type="file" id="media" accept="image/*,video/*"></div>
        <div class="form-group"><label>శీర్షిక (Title)</label><input type="text" id="title" placeholder="వార్త శీర్షిక..."></div>
        <div class="form-group">
            <label>వివరణ (Description)</label>
            <div class="toolbar"><button class="tool-btn" onclick="makeBold()">Bold (బ్లూ హైలైట్)</button></div>
            <textarea id="desc" placeholder="పూర్తి వివరణ..."></textarea>
        </div>
        <div class="form-group"><label>విభాగం</label><input type="text" id="tag" placeholder="రాజకీయాలు, క్రీడలు..."></div>
        <button class="post-btn" id="postBtn">పబ్లిష్ చేయి</button>
        <div id="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyDQJ0x2mFZqoCgiE_34fg9WxomurFWoopg", authDomain: "newsbytes-848a9.firebaseapp.com", projectId: "newsbytes-848a9", storageBucket: "newsbytes-848a9.firebasestorage.app", messagingSenderId: "26695955001", appId: "1:26695955001:web:0c25b74d7a849f4a9d13e8" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        window.makeBold = () => {
            const area = document.getElementById('desc');
            const sel = area.value.substring(area.selectionStart, area.selectionEnd);
            area.value = area.value.substring(0, area.selectionStart) + "<b>" + sel + "</b>" + area.value.substring(area.selectionEnd);
        };

        document.getElementById('postBtn').addEventListener('click', async () => {
            const media = document.getElementById('media').files[0];
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;
            const status = document.getElementById('status');
            if(!media || !title || !desc) return alert("అన్నీ ఫిల్ చేయండి!");

            status.style.display = "block"; status.innerText = "అప్‌లోడ్ అవుతోంది...";
            document.getElementById('postBtn').disabled = true;

            try {
                const formData = new FormData();
                formData.append("file", media);
                formData.append("upload_preset", "Newsbytes");
                const res = await fetch(`https://api.cloudinary.com/v1_1/cx4ru5e5/${media.type.includes('video')?'video':'image'}/upload`, { method: "POST", body: formData });
                const data = await res.json();

                await addDoc(collection(db, "news"), { title, desc, tag: document.getElementById('tag').value || "General", mediaUrl: data.secure_url, mediaType: media.type.includes('video')?'video':'image', timestamp: serverTimestamp() });
                status.style.color = "green"; status.innerText = "NB | వార్త పోస్ట్ అయ్యింది! 🏆";
                document.getElementById('title').value = ""; document.getElementById('desc').value = "";
            } catch (e) { status.style.color = "red"; status.innerText = "Error!"; }
            finally { document.getElementById('postBtn').disabled = false; }
        });
    </script>
</body>
</html>
