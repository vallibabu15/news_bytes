<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Bytes - Live Overlay</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #00FF00; overflow: hidden; font-family: 'Arial', sans-serif; }

        /* వెనకాల ప్లే అయ్యే మెయిన్ వీడియో */
        #bgVideo {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }

        /* పైన ఉండే గ్రాఫిక్స్ లేయర్ */
        .graphics-layer { position: relative; z-index: 10; width: 100%; height: 100%; pointer-events: none; }

        /* ఛానల్ లోగో బగ్ */
        .logo-bug {
            position: absolute; top: 20px; right: 20px;
            width: 130px; background: white;
            padding: 8px; border-radius: 10px; border-bottom: 5px solid #ff0000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .logo-bug img { width: 100%; height: auto; display: block; }

        /* లోకేషన్ బాక్స్ */
        .location-box {
            position: absolute; bottom: 110px; left: 0;
            background: #ff0000; color: white; padding: 6px 20px;
            font-weight: bold; font-size: 22px; border-right: 6px solid #ffd700;
            box-shadow: 3px 0 10px rgba(0,0,0,0.3);
        }

        /* న్యూస్ ఫుటర్ (Bottom Graphics) */
        .news-footer {
            position: absolute; bottom: 0; width: 100%; height: 110px;
            display: flex; flex-direction: column;
        }

        /* బ్రేకింగ్ న్యూస్ బార్ (Red) */
        .breaking-bar {
            background: linear-gradient(90deg, #ff0000 0%, #800000 100%);
            height: 55px; display: flex; align-items: center;
            color: white; font-weight: bold; border-top: 2px solid #ffd700;
            overflow: hidden; position: relative;
        }
        .breaking-label {
            background: #fff; color: #ff0000; padding: 5px 15px;
            font-size: 20px; z-index: 12; box-shadow: 5px 0 10px rgba(0,0,0,0.5);
            white-space: nowrap; height: 100%; display: flex; align-items: center;
        }
        .headline-wrap { flex-grow: 1; overflow: hidden; white-space: nowrap; }
        .headline-text {
            display: inline-block; padding-left: 100%;
            font-size: 30px; animation: scroll-head 15s linear infinite;
        }

        /* టిక్కర్ బార్ (Blue) */
        .ticker-bar {
            background: rgba(0, 0, 40, 0.95); height: 40px;
            display: flex; align-items: center; border-top: 1px solid #444;
        }
        .time-box {
            background: #ffd700; color: #000; padding: 0 15px;
            height: 100%; display: flex; align-items: center;
            font-weight: bold; font-size: 18px; z-index: 15;
        }
        .ticker-wrap { flex-grow: 1; overflow: hidden; white-space: nowrap; }
        .ticker-text {
            display: inline-block; padding-left: 100%; color: white;
            font-size: 22px; animation: scroll-ticker 25s linear infinite;
        }

        @keyframes scroll-head { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        @keyframes scroll-ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <!-- వెనకాల ప్లే అయ్యే అప్‌లోడెడ్ వీడియో -->
    <video id="bgVideo" autoplay loop playsinline></video>

    <!-- పైన గ్రాఫిక్స్ -->
    <div class="graphics-layer">
        <div class="logo-bug">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh2mta9Iy8-4mBSEIR9zBP3rQegrCAOnmCWv8AIs8Y1a9MYgBWIzg7IcajCAH_wmEXmfsyglaEELRXheyQFqlm-PHMmDpppi-aDuNEgCYEK5Dc_kSmjoFgoIyUpD44Ke26C3LzVrt00pD9VC00P5I7wgf8jssacWWdE3xbu609hb5qpOGh3NlKjyCPyn7yg/s1844/106383.png">
        </div>

        <div class="location-box" id="locDisplay">లైవ్</div>

        <div class="news-footer">
            <div class="breaking-bar">
                <div class="breaking-label">BREAKING NEWS</div>
                <div class="headline-wrap">
                    <div class="headline-text" id="headDisplay">లోడ్ అవుతోంది...</div>
                </div>
            </div>
            <div class="ticker-bar">
                <div class="time-box" id="clock">00:00</div>
                <div class="ticker-wrap">
                    <div class="ticker-text">| తాజా సమాచారం నిరంతరం మీ ముందుకు.. News Bytes - ప్రజల గొంతుక మా స్పందన |</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQJ0Jx2mFZqoCgiE_34fg9WxomurFWoopg",
            authDomain: "newsbytes-848a9.firebaseapp.com",
            projectId: "newsbytes-848a9",
            storageBucket: "newsbytes-848a9.firebasestorage.app",
            messagingSenderId: "26695955001",
            appId: "1:26695955001:web:0c25b74d7a849f4a9d13e8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Firebase నుండి లేటెస్ట్ వార్త మరియు వీడియోను తీసుకురావడం
        onSnapshot(query(collection(db, "news"), orderBy("timestamp", "desc"), limit(1)), (snapshot) => {
            snapshot.forEach(doc => {
                const data = doc.data();
                // వీడియో ఉంటే ప్లే చేస్తుంది
                if (data.mediaType === 'video') {
                    const videoElement = document.getElementById('bgVideo');
                    videoElement.src = data.mediaUrl;
                    videoElement.play();
                }
                // టైటిల్ మరియు ట్యాగ్ అప్‌డేట్
                document.getElementById('headDisplay').innerText = data.title;
                document.getElementById('locDisplay').innerText = data.tag || "లైవ్";
            });
        });

        // గడియారం
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000); updateClock();
    </script>
</body>
</html>
