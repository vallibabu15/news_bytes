<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>News Bytes</title>
    <meta property="og:site_name" content="News Bytes">
    <meta property="og:title" content="News Bytes | తాజా వార్తలు క్షణాల్లో..">
    <meta property="og:image" content="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh2mta9Iy8-4mBSEIR9zBP3rQegrCAOnmCWv8AIs8Y1a9MYgBWIzg7IcajCAH_wmEXmfsyglaEELRXheyQFqlm-PHMmDpppi-aDuNEgCYEK5Dc_kSmjoFgoIyUpD44Ke26C3LzVrt00pD9VC00P5I7wgf8jssacWWdE3xbu609hb5qpOGh3NlKjyCPyn7yg/s1844/106383.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.init({
            appId: "76c6f912-be9e-4f6c-b07e-dc2c4658573f",
          });
        } catch(e) {}
      });
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100%; height: 100%; overflow: hidden; position: fixed; 
            font-family: Arial, sans-serif; background: #fff; touch-action: none;
        }
        
        .main-container { 
            width: 100%; height: 100%; display: flex; flex-direction: column; 
            background: #fff; overflow: hidden; position: relative;
        }

        /* స్థిరమైన టాప్ హెడర్ */
        .top-header { 
            height: 55px; width: 100%; background: #fff; border-bottom: 1px solid #eee; 
            flex-shrink: 0; z-index: 100; overflow: hidden;
        }
        .top-header img { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* Way2News స్లైడర్ వ్యూపోర్ట్ */
        .slider-viewport { 
            flex: 1; width: 100%; position: relative; overflow: hidden; 
            background: #fff; touch-action: none;
        }
        #slider-track { 
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; 
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* న్యూస్ కార్డ్ */
        .news-card { 
            position: absolute; left: 0; width: 100%; height: 100%; 
            background: #fff; display: flex; flex-direction: column; overflow: hidden;
            border-bottom: 1px solid #eee;
        }
        
        /* మీడియా (ఫోటో/వీడియో) */
        .news-media { 
            width: 100%; height: 42%; background: #000; overflow: hidden; 
            flex-shrink: 0; position: relative;
        }
        .news-media img, .news-media video { 
            width: 100%; height: 100%; object-fit: cover; display: block; 
        }

        /* వార్త కంటెంట్ */
        .news-content { 
            flex: 1; padding: 12px 16px 45px 16px; position: relative; 
            display: flex; flex-direction: column; overflow: hidden;
        }
        .news-title { 
            font-size: 18px; color: #ff0000; font-weight: bold; margin: 0 0 6px 0; 
            line-height: 1.35; flex-shrink: 0;
        }
        .news-desc { 
            font-size: 15px; color: #333; line-height: 1.6; text-align: justify; 
            margin: 0; overflow: hidden; flex: 1;
        }
        .news-desc b { color: #0033cc; font-weight: bold; }

        @keyframes sharp-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }

        /* ఇంకా చదవండి & వ్యూస్ బార్ */
        .card-bottom-bar {
            position: absolute; bottom: 8px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }

        .read-more-btn {
            background: none; border: none; padding: 0;
            font-size: 16px; font-weight: 900; color: #ff0000; cursor: pointer;
            animation: sharp-blink 1.2s infinite ease-in-out;
        }

        .views-badge {
            font-size: 13px; color: #555; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
            background: #f0f2f5; padding: 3px 8px; border-radius: 10px;
        }
        .views-badge i { color: #0044ff; }

        /* స్థిరమైన కింద బటన్లు (ఎప్పుడూ స్క్రీన్ మీదే ఉంటాయి) */
        .bottom-actions { 
            height: 65px; width: 100%; background: #fff; border-top: 1px solid #eee; 
            display: flex; justify-content: space-around; align-items: center; 
            flex-shrink: 0; z-index: 100;
        }
        .btn-action { 
            border: none; background: none; text-align: center; color: #444; 
            font-size: 11px; font-weight: bold; display: flex; flex-direction: column; 
            align-items: center; width: 25%; cursor: pointer; 
        }
        .btn-icon { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; margin-bottom: -2px; font-size: 26px; }
        
        .bell-icon { font-size: 36px !important; color: #ff0000; animation: sharp-blink 1.2s infinite; }
        .is-following .bell-icon { color: #000; animation: none; }
        .wa-c { color: #075E54; } .yt-c { color: #FF0000; } .sh-c { color: #0022bb; }

        /* ఫుల్ వ్యూ */
        #full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; display: none; overflow-y: auto; padding: 15px; }
        .close-view { position: fixed; top: 15px; right: 15px; background: #ff0000; color: #fff; width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 20px; z-index: 2101; cursor: pointer; }
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 8px 18px; border-radius: 20px; display: none; z-index: 3000; font-size: 13px; white-space: nowrap; }

        /* లోడర్ */
        #loader-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; color: #888; font-weight: bold; font-size: 14px;
        }
        .spinner {
            width: 30px; height: 30px; border: 3px solid #eee; border-top: 3px solid #ff0000;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- టాప్ హెడర్ -->
        <div class="top-header">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh2mta9Iy8-4mBSEIR9zBP3rQegrCAOnmCWv8AIs8Y1a9MYgBWIzg7IcajCAH_wmEXmfsyglaEELRXheyQFqlm-PHMmDpppi-aDuNEgCYEK5Dc_kSmjoFgoIyUpD44Ke26C3LzVrt00pD9VC00P5I7wgf8jssacWWdE3xbu609hb5qpOGh3NlKjyCPyn7yg/s1844/106383.png">
        </div>

        <!-- న్యూస్ స్లైడర్ -->
        <div class="slider-viewport" id="viewport">
            <div id="loader-box"><div class="spinner"></div><span>లోడ్ అవుతోంది...</span></div>
            <div id="slider-track"></div>
        </div>

        <!-- కింద బటన్లు -->
        <div class="bottom-actions" id="global-actions"></div>
    </div>

    <!-- ఫుల్ న్యూస్ మోడల్ -->
    <div id="full-view">
        <button class="close-view" onclick="closeFullNews()"><i class="fas fa-times"></i></button>
        <div id="full-view-content" style="margin-top:40px;"></div>
    </div>
    <div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDQJ0x2mFZqoCgiE_34fg9WxomurFWoopg", authDomain: "newsbytes-848a9.firebaseapp.com", projectId: "newsbytes-848a9", storageBucket: "newsbytes-848a9.firebasestorage.app", messagingSenderId: "26695955001", appId: "1:26695955001:web:0c25b74d7a849f4a9d13e8" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let newsList = [];
    let currentIndex = 0;

    const viewport = document.getElementById("viewport");
    const track = document.getElementById("slider-track");
    const bottomActions = document.getElementById("global-actions");
    const loaderBox = document.getElementById("loader-box");
    window.isUserFollowing = localStorage.getItem("news_following") === "true";

    const urlParams = new URLSearchParams(window.location.search);
    const targetNewsId = urlParams.get('id');
    let hasLoadedTarget = false;

    // మీడియా స్పీడ్ ఆప్టిమైజేషన్
    function getFastUrl(url, type) {
        if (!url) return "";
        if (url.includes("cloudinary.com") && url.includes("/upload/")) {
            return type === "video"
                ? url.replace("/upload/", "/upload/f_auto,q_auto,vc_auto,w_720/")
                : url.replace("/upload/", "/upload/f_auto,q_auto,w_800/");
        }
        return url;
    }

    // వ్యూస్ కౌంట్ రికార్డర్
    const viewedSet = new Set(JSON.parse(sessionStorage.getItem("viewed_news") || "[]"));
    function recordView(newsId) {
        if (!newsId || viewedSet.has(newsId)) return;
        viewedSet.add(newsId);
        sessionStorage.setItem("viewed_news", JSON.stringify([...viewedSet]));
        try {
            updateDoc(doc(db, "news", newsId), { views: increment(1) });
        } catch (e) {}
    }

    // OneSignal
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
        try {
            if (OneSignal.User && OneSignal.User.PushSubscription && OneSignal.User.PushSubscription.optedIn) {
                window.isUserFollowing = true;
                localStorage.setItem("news_following", "true");
                updateBottomActions();
            }
            if (OneSignal.User && OneSignal.User.PushSubscription) {
                OneSignal.User.PushSubscription.addEventListener("change", (e) => {
                    window.isUserFollowing = !!(e.current && e.current.optedIn);
                    localStorage.setItem("news_following", window.isUserFollowing ? "true" : "false");
                    updateBottomActions();
                });
            }
        } catch(e) {}
    });

    // వార్తలు లోడ్ చేయడం
    const q = query(collection(db, "news"), orderBy("timestamp", "desc"), limit(25));
    onSnapshot(q, (snapshot) => {
        loaderBox.style.display = "none";
        newsList = []; 
        snapshot.forEach(doc => newsList.push({ id: doc.id, ...doc.data() }));

        if (targetNewsId && !hasLoadedTarget) {
            const foundIndex = newsList.findIndex(item => item.id === targetNewsId);
            if (foundIndex !== -1) {
                currentIndex = foundIndex;
                hasLoadedTarget = true;
            }
        }

        renderSlider();
    });

    // Way2News నిలువు స్లైడర్ రెండరింగ్
    function renderSlider() {
        track.innerHTML = "";
        
        newsList.forEach((data, index) => {
            const card = document.createElement("div"); 
            card.className = "news-card";
            card.style.top = (index * 100) + "%"; // నిలువుగా వరుసగా ఉంటాయి
            
            let cleanDesc = (data.desc || "").replace(/<[^>]*>?/gm, '');
            let shortDesc = cleanDesc.length > 250 ? cleanDesc.substring(0, 240) + "..." : cleanDesc;
            
            const fastMedia = getFastUrl(data.mediaUrl, data.mediaType);
            const mediaHtml = data.mediaType === 'video' 
                ? `<video src="${fastMedia}" autoplay loop muted playsinline preload="metadata"></video>` 
                : `<img src="${fastMedia}" loading="lazy">`;

            card.innerHTML = `
                <div class="news-media">${mediaHtml}</div>
                <div class="news-content">
                    <h2 class="news-title">${data.title || ""}</h2>
                    <div class="news-desc">${shortDesc}</div>
                    <div class="card-bottom-bar">
                        <button class="read-more-btn" onclick="openFullNews(${index})">ఇంకా చదవండి...</button>
                        <div class="views-badge"><i class="fas fa-eye"></i> <span>${data.views || 0}</span></div>
                    </div>
                </div>`;
            track.appendChild(card);
        });

        if (newsList[currentIndex]) {
            recordView(newsList[currentIndex].id);
        }

        updateBottomActions(); 
        goToSlide(currentIndex, false);
    }

    function goToSlide(index, animate = true) {
        currentIndex = index;
        track.style.transition = animate ? "transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)" : "none";
        track.style.transform = `translateY(-${currentIndex * 100}%)`;
    }

    function updateBottomActions() {
        if (!newsList[currentIndex]) return;
        const data = newsList[currentIndex];
        bottomActions.innerHTML = `
            <button class="btn-action" onclick="goShare('${data.id}', '${(data.title||"").replace(/'/g,"")}')">
                <i class="fab fa-whatsapp btn-icon wa-c"></i><span>వాట్సాప్</span>
            </button>
            <button class="btn-action" onclick="window.open('https://www.youtube.com')">
                <i class="fab fa-youtube btn-icon yt-c"></i><span>యూట్యూబ్</span>
            </button>
            <button class="btn-action" onclick="goShare('${data.id}', '${(data.title||"").replace(/'/g,"")}')">
                <i class="fas fa-share-alt btn-icon sh-c"></i><span>షేర్</span>
            </button>
            <button class="btn-action ${window.isUserFollowing?'is-following':''}" onclick="handleBell()">
                <i class="fas fa-bell btn-icon bell-icon"></i><span>${window.isUserFollowing?'ఫాలోయింగ్':'ఫాలో'}</span>
            </button>`;
    }

    window.handleBell = async () => {
        try {
            window.OneSignalDeferred = window.OneSignalDeferred || [];
            window.OneSignalDeferred.push(async function(OneSignal) {
                await OneSignal.Notifications.requestPermission();
                await OneSignal.User.PushSubscription.optIn();
                window.isUserFollowing = true;
                localStorage.setItem("news_following", "true");
                showToast("NB | అలెర్ట్స్ ఆన్ అయ్యాయి!");
                updateBottomActions();
            });
        } catch (e) { 
            alert("నోటిఫికేషన్ పర్మిషన్ ఇవ్వాలి!");
        }
    };

    window.openFullNews = (index) => {
        const data = newsList[index];
        const fastMedia = getFastUrl(data.mediaUrl, data.mediaType);
        const fullMedia = data.mediaType === 'video'
            ? `<video src="${fastMedia}" controls autoplay playsinline style="width:100%; border-radius:10px;"></video>`
            : `<img src="${fastMedia}" style="width:100%; border-radius:10px;">`;

        document.getElementById("full-view-content").innerHTML = `
            ${fullMedia}
            <h2 style="color:#ff0000; font-size:20px; margin-top:15px; line-height:1.4;">NB | ${data.title}</h2>
            <div style="font-size:16px; line-height:1.8; color:#333; margin-top:10px;">${data.desc}</div>`;
        document.getElementById("full-view").style.display = "block";
    };
    window.closeFullNews = () => document.getElementById("full-view").style.display = "none";

    // పక్కా Way2News టచ్ & డ్రాగ్ హ్యాండ్లర్
    let startY = 0;
    let currentY = 0;
    let isDragging = false;

    viewport.addEventListener("touchstart", (e) => {
        if (e.target.closest('#full-view')) return;
        startY = e.touches[0].clientY;
        currentY = startY;
        isDragging = true;
        track.style.transition = "none"; // వేలితో పాటే కదులుతుంది
    }, { passive: true });

    viewport.addEventListener("touchmove", (e) => {
        if (!isDragging) return;
        currentY = e.touches[0].clientY;
        const deltaY = currentY - startY;
        const vh = viewport.clientHeight || window.innerHeight;
        const movePercent = (deltaY / vh) * 100;
        
        // చివర్లో ఉన్నప్పుడు సాగడం
        if ((currentIndex === 0 && deltaY > 0) || (currentIndex === newsList.length - 1 && deltaY < 0)) {
            track.style.transform = `translateY(${-currentIndex * 100 + movePercent * 0.25}%)`;
        } else {
            track.style.transform = `translateY(${-currentIndex * 100 + movePercent}%)`;
        }
    }, { passive: true });

    viewport.addEventListener("touchend", () => {
        if (!isDragging) return;
        isDragging = false;
        
        const deltaY = currentY - startY;
        if (deltaY < -45 && currentIndex < newsList.length - 1) {
            currentIndex++;
        } else if (deltaY > 45 && currentIndex > 0) {
            currentIndex--;
        }
        
        goToSlide(currentIndex, true);
        updateBottomActions();
        if (newsList[currentIndex]) {
            recordView(newsList[currentIndex].id);
        }
    });

    window.goShare = (id, title) => {
        const link = `https://vallibabu15.github.io/news_bytes/?id=${id}`;
        const text = "NB | " + title + "\n\nవార్త ఇక్కడ చూడండి: " + link;
        if (navigator.share) { 
            navigator.share({ title: 'News Bytes', text: text }).catch(console.error); 
        } else { 
            navigator.clipboard.writeText(text); 
            showToast("NB | లింక్ కాపీ అయ్యింది ✓"); 
        }
    };

    function showToast(msg) { 
        const t = document.getElementById("toast"); 
        t.innerText = msg; 
        t.style.display = "block"; 
        setTimeout(() => t.style.display = "none", 2500); 
    }
</script>
</body>
</html>
