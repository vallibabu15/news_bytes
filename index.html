<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>News Bytes</title>
    <meta property="og:site_name" content="News Bytes">
    <meta property="og:title" content="News Bytes | తాజా వార్తలు క్షణాల్లో..">
    <meta property="og:image" content="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh2mta9Iy8-4mBSEIR9zBP3rQegrCAOnmCWv8AIs8Y1a9MYgBWIzg7IcajCAH_wmEXmfsyglaEELRXheyQFqlm-PHMmDpppi-aDuNEgCYEK5Dc_kSmjoFgoIyUpD44Ke26C3LzVrt00pD9VC00P5I7wgf8jssacWWdE3xbu609hb5qpOGh3NlKjyCPyn7yg/s1844/106383.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "76c6f912-be9e-4f6c-b07e-dc2c4658573f",
        });
      });
    </script>

    <style>
        * { box-sizing: border-box; }
        :root { --h-h: 58px; --f-h: 68px; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; background: #fff; overflow: hidden; touch-action: none; }
        .main-container { width: 100%; height: 100dvh; display: flex; flex-direction: column; background: #fff; position: relative; }

        .top-header { height: var(--h-h); width: 100%; background: #fff; z-index: 100; overflow: hidden; border-bottom: 1px solid #eee; flex-shrink: 0; }
        .top-header img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .slider-viewport { flex: 1; position: relative; overflow: hidden; background: #f0f2f5; perspective: 1800px; width: 100%; }
        #slider-track { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1); }

        .news-card { 
            position: absolute; width: 100%; height: 100%; background: #fff; backface-visibility: hidden; display: flex; flex-direction: column;
            border-top: 1px solid #eee; border-bottom: 1px solid #eee; overflow: hidden;
        }
        
        .news-media { width: 100%; height: 38%; background: #000; overflow: hidden; position: relative; flex-shrink: 0; }
        .news-media img, .news-media video { width: 100%; height: 100%; object-fit: cover; display: block; }

        .news-content { padding: 10px 14px 42px 14px; flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .news-title { font-size: 17.5px; color: #ff0000; font-weight: bold; margin: 0 0 6px 0; line-height: 1.35; flex-shrink: 0; }
        .news-desc { font-size: 15px; color: #333; line-height: 1.55; text-align: justify; margin: 0; overflow: hidden; flex: 1; }
        .news-desc b { color: #0033cc; font-weight: 900; background: linear-gradient(to bottom, #00a2ff 0%, #0044ff 50%, #0022aa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        @keyframes sharp-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }

        .read-more-btn {
            position: absolute; bottom: 8px; left: 14px; background: none; border: none; padding: 0;
            font-size: 16px; font-weight: 900; color: #ff0000; cursor: pointer; z-index: 10;
            animation: sharp-blink 1.2s infinite ease-in-out;
        }

        .views-badge {
            position: absolute; bottom: 8px; right: 14px;
            font-size: 13px; color: #555; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
            background: #f0f2f5; padding: 3px 8px; border-radius: 10px; z-index: 10;
        }
        .views-badge i { color: #0044ff; }

        .bottom-actions { height: var(--f-h); background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .btn-action { border: none; background: none; text-align: center; color: #444; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; align-items: center; width: 25%; }
        .btn-icon { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; margin-bottom: -2px; font-size: 26px; }
        
        .bell-icon { font-size: 36px !important; color: #ff0000; animation: sharp-blink 1.2s infinite; }
        .is-following .bell-icon { color: #000; animation: none; }
        .wa-c { color: #075E54; } .yt-c { color: #FF0000; } .sh-c { color: #0022bb; }

        #full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; display: none; overflow-y: auto; padding: 15px; }
        .close-view { position: fixed; top: 15px; right: 15px; background: #ff0000; color: #fff; width: 42px; height: 42px; border-radius: 50%; border: none; font-size: 22px; z-index: 2101; cursor: pointer; }
        #toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 8px 18px; border-radius: 20px; display: none; z-index: 3000; font-size: 13px; white-space: nowrap; }

        #loader-box {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; color: #888; font-weight: bold; font-size: 14px;
        }
        .spinner {
            width: 32px; height: 32px; border: 3px solid #eee; border-top: 3px solid #ff0000;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="top-header"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh2mta9Iy8-4mBSEIR9zBP3rQegrCAOnmCWv8AIs8Y1a9MYgBWIzg7IcajCAH_wmEXmfsyglaEELRXheyQFqlm-PHMmDpppi-aDuNEgCYEK5Dc_kSmjoFgoIyUpD44Ke26C3LzVrt00pD9VC00P5I7wgf8jssacWWdE3xbu609hb5qpOGh3NlKjyCPyn7yg/s1844/106383.png"></div>
        <div class="slider-viewport" id="viewport">
            <div id="loader-box"><div class="spinner"></div><span>లోడ్ అవుతోంది...</span></div>
            <div id="slider-track"></div>
        </div>
        <div class="bottom-actions" id="global-actions"></div>
    </div>
    <div id="full-view"><button class="close-view" onclick="closeFullNews()"><i class="fas fa-times"></i></button><div id="full-view-content" style="margin-top:45px;"></div></div>
    <div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDQJ0x2mFZqoCgiE_34fg9WxomurFWoopg", authDomain: "newsbytes-848a9.firebaseapp.com", projectId: "newsbytes-848a9", storageBucket: "newsbytes-848a9.firebasestorage.app", messagingSenderId: "26695955001", appId: "1:26695955001:web:0c25b74d7a849f4a9d13e8" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let cached = localStorage.getItem("news_cache");
    let newsList = cached ? JSON.parse(cached) : [];
    let currentIndex = 0;

    const viewport = document.getElementById("viewport");
    const track = document.getElementById("slider-track");
    const bottomActions = document.getElementById("global-actions");
    const loaderBox = document.getElementById("loader-box");
    window.isUserFollowing = localStorage.getItem("news_following") === "true";

    const urlParams = new URLSearchParams(window.location.search);
    const targetNewsId = urlParams.get('id');
    let hasLoadedTarget = false;

    function getFastUrl(url, type) {
        if (!url) return "";
        if (url.includes("cloudinary.com") && url.includes("/upload/")) {
            return type === "video"
                ? url.replace("/upload/", "/upload/f_auto,q_auto,vc_auto,w_720/")
                : url.replace("/upload/", "/upload/f_auto,q_auto,w_800/");
        }
        return url;
    }

    if (newsList.length > 0) {
        loaderBox.style.display = "none";
        renderCube();
    }

    const viewedSet = new Set(JSON.parse(sessionStorage.getItem("viewed_news") || "[]"));
    function recordView(newsId) {
        if (!newsId || viewedSet.has(newsId)) return;
        viewedSet.add(newsId);
        sessionStorage.setItem("viewed_news", JSON.stringify([...viewedSet]));
        try {
            updateDoc(doc(db, "news", newsId), { views: increment(1) });
        } catch (e) {}
    }

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
        if (OneSignal.User.PushSubscription.optedIn) {
            window.isUserFollowing = true;
            localStorage.setItem("news_following", "true");
            updateBottomActions();
        }
        OneSignal.User.PushSubscription.addEventListener("change", (e) => {
            window.isUserFollowing = !!e.current.optedIn;
            localStorage.setItem("news_following", window.isUserFollowing ? "true" : "false");
            updateBottomActions();
        });
    });

    const q = query(collection(db, "news"), orderBy("timestamp", "desc"), limit(25));
    onSnapshot(q, (snapshot) => {
        loaderBox.style.display = "none";
        newsList = []; 
        snapshot.forEach(doc => newsList.push({ id: doc.id, ...doc.data() }));
        localStorage.setItem("news_cache", JSON.stringify(newsList));

        if (targetNewsId && !hasLoadedTarget) {
            const foundIndex = newsList.findIndex(item => item.id === targetNewsId);
            if (foundIndex !== -1) {
                currentIndex = foundIndex;
                hasLoadedTarget = true;
            }
        }

        renderCube();
    });

    function renderCube() {
        track.innerHTML = "";
        const h = viewport.offsetHeight || window.innerHeight - 126;

        newsList.forEach((data, index) => {
            const card = document.createElement("div"); 
            card.className = "news-card";
            card.style.transform = `rotateX(${index * -90}deg) translateZ(${h / 2}px)`;
            
            let cleanDesc = (data.desc || "").replace(/<[^>]*>?/gm, '');
            let shortDesc = cleanDesc.length > 280 ? cleanDesc.substring(0, 270) + "..." : cleanDesc;
            
            const fastMedia = getFastUrl(data.mediaUrl, data.mediaType);
            const mediaHtml = data.mediaType === 'video' 
                ? `<video src="${fastMedia}" autoplay loop muted playsinline preload="metadata"></video>` 
                : `<img src="${fastMedia}" loading="lazy">`;

            card.innerHTML = `
                <div class="news-media">${mediaHtml}</div>
                <div class="news-content">
                    <h2 class="news-title">${data.title}</h2>
                    <div class="news-desc">${shortDesc}</div>
                    <button class="read-more-btn" onclick="openFullNews(${index})">ఇంకా చదవండి...</button>
                    <div class="views-badge"><i class="fas fa-eye"></i> <span>${data.views || 0}</span></div>
                </div>`;
            track.appendChild(card);
        });

        if (newsList[currentIndex]) {
            recordView(newsList[currentIndex].id);
        }

        updateBottomActions(); 
        updateRotation(0);
    }

    function updateBottomActions() {
        if (!newsList[currentIndex]) return;
        const data = newsList[currentIndex];
        bottomActions.innerHTML = `<button class="btn-action" onclick="goShare('${data.id}', '${data.title.replace(/'/g,"")}')"><i class="fab fa-whatsapp btn-icon wa-c"></i><span>వాట్సాప్</span></button>
            <button class="btn-action" onclick="window.open('https://www.youtube.com')"><i class="fab fa-youtube btn-icon yt-c"></i><span>యూట్యూబ్</span></button>
            <button class="btn-action" onclick="goShare('${data.id}', '${data.title.replace(/'/g,"")}')"><i class="fas fa-share-alt btn-icon sh-c"></i><span>షేర్</span></button>
            <button class="btn-action ${window.isUserFollowing?'is-following':''}" onclick="handleBell()"><i class="fas fa-bell btn-icon bell-icon"></i><span>${window.isUserFollowing?'ఫాలోయింగ్':'ఫాలో'}</span></button>`;
    }

    window.handleBell = async () => {
        try {
            window.OneSignalDeferred = window.OneSignalDeferred || [];
            window.OneSignalDeferred.push(async function(OneSignal) {
                await OneSignal.Notifications.requestPermission();
                await OneSignal.User.PushSubscription.optIn();
                window.isUserFollowing = true;
                localStorage.setItem("news_following", "true");
                showToast("NB | అలెర్ట్స్ ఆన్ అయ్యాయి!");
                updateBottomActions();
            });
        } catch (e) { 
            console.error(e); 
            alert("నోటిఫికేషన్ పర్మిషన్ ఇవ్వాలి!");
        }
    };

    window.openFullNews = (index) => {
        const data = newsList[index];
        const fastMedia = getFastUrl(data.mediaUrl, data.mediaType);
        const fullMedia = data.mediaType === 'video'
            ? `<video src="${fastMedia}" controls autoplay playsinline style="width:100%; border-radius:10px;"></video>`
            : `<img src="${fastMedia}" style="width:100%; border-radius:10px;">`;

        document.getElementById("full-view-content").innerHTML = `
            ${fullMedia}
            <h2 style="color:#ff0000; font-size:20px; margin-top:15px; line-height:1.4;">NB | ${data.title}</h2>
            <div style="font-size:16px; line-height:1.8; color:#333; margin-top:10px;">${data.desc}</div>`;
        document.getElementById("full-view").style.display = "block";
    };
    window.closeFullNews = () => document.getElementById("full-view").style.display = "none";

    let startY = 0; 
    let isMoving = false;

    function updateRotation(extraDeg) { 
        const h = viewport.offsetHeight || window.innerHeight - 126;
        track.style.transform = `translateZ(-${h / 2}px) rotateX(${(currentIndex * 90) + extraDeg}deg)`; 
    }

    // మొబైల్ టచ్ & స్క్రోలింగ్ సరిచేశాను
    viewport.addEventListener("touchstart", (e) => { 
        startY = e.touches[0].clientY; 
        isMoving = true; 
    }, {passive: true});

    viewport.addEventListener("touchmove", (e) => { 
        if (!isMoving) return; 
        const deltaY = startY - e.touches[0].clientY; 
        if (Math.abs(deltaY) > 8) {
            updateRotation((deltaY / viewport.offsetHeight) * 90);
        }
    }, {passive: true});

    viewport.addEventListener("touchend", (e) => { 
        if (!isMoving) return; 
        isMoving = false; 
        const deltaY = startY - e.changedTouches[0].clientY; 
        if (Math.abs(deltaY) > 50) { 
            if (deltaY > 0 && currentIndex < newsList.length - 1) {
                currentIndex++;
            } else if (deltaY < 0 && currentIndex > 0) {
                currentIndex--; 
            }
            updateBottomActions(); 
            if (newsList[currentIndex]) {
                recordView(newsList[currentIndex].id);
            }
        } 
        updateRotation(0); 
    });

    window.goShare = (id, title) => {
        const link = `https://vallibabu15.github.io/news_bytes/?id=${id}`;
        const text = "NB | " + title + "\n\nవార్త ఇక్కడ చూడండి: " + link;
        if (navigator.share) { 
            navigator.share({ title: 'News Bytes', text: text }).catch(console.error); 
        } else { 
            navigator.clipboard.writeText(text); 
            showToast("NB | లింక్ కాపీ అయ్యింది ✓"); 
        }
    };

    function showToast(msg) { 
        const t = document.getElementById("toast"); 
        t.innerText = msg; 
        t.style.display = "block"; 
        setTimeout(() => t.style.display = "none", 2500); 
    }

    window.addEventListener("resize", () => {
        renderCube();
    });
</script>
</body>
</html>
