<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>News Bytes</title>
    <meta property="og:site_name" content="News Bytes">
    <meta property="og:title" content="News Bytes | తాజా వార్తలు">
    <meta property="og:description" content="ప్రజా స్పందన - ప్రజల గొంతుక మా స్పందన">
    <meta property="og:image" content="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh2mta9Iy8-4mBSEIR9zBP3rQegrCAOnmCWv8AIs8Y1a9MYgBWIzg7IcajCAH_wmEXmfsyglaEELRXheyQFqlm-PHMmDpppi-aDuNEgCYEK5Dc_kSmjoFgoIyUpD44Ke26C3LzVrt00pD9VC00P5I7wgf8jssacWWdE3xbu609hb5qpOGh3NlKjyCPyn7yg/s1844/106383.png">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; background: #000; overflow: hidden; touch-action: none; }
        .main-container { width: 100%; height: 100vh; display: flex; flex-direction: column; background: #fff; perspective: 1500px; }
        .top-header { width: 100%; background: #fff; z-index: 100; line-height: 0; overflow: hidden; }
        .top-header img { width: 100%; height: auto; display: block; margin: 0 auto; }
        .slider-viewport { width: 100%; flex-grow: 1; position: relative; overflow: hidden; background: #fff; }
        #slider-track { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; }
        .news-card { position: absolute; width: 100%; height: 100%; background: #fff; backface-visibility: hidden; display: flex; flex-direction: column; border-top: 1px solid #111; border-bottom: 1px solid #111; box-sizing: border-box; }
        .news-media { width: 100%; height: 38%; background: #000; overflow: hidden; }
        .news-media img, .news-media video { width: 100%; height: 100%; object-fit: cover; }
        .news-content { padding: 10px 15px; flex-grow: 1; overflow: hidden; position: relative; }
        .news-title { font-size: 17px; color: #ff0000; font-weight: bold; margin: 0 0 5px 0; line-height: 1.3; }
        .news-desc { font-size: 14.5px; color: #333; line-height: 1.5; text-align: justify; margin: 0; }
        .news-desc b, .news-desc strong { color: #0033cc; font-weight: 900; }
        @keyframes sharp-blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        .on-screen-actions { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .read-more-btn, .screen-btn { background: none; border: none; padding: 0; font-size: 15px; font-weight: 900; color: #ff0000; cursor: pointer; animation: sharp-blink 0.6s infinite ease-in-out; }
        .screen-btn { font-size: 20px; }
        .bottom-actions { background: #fff; padding: 2px 0 6px 0; border-top: 1px solid #eee; display: flex; justify-content: space-around; z-index: 50; }
        .btn-action { border: none; background: none; text-align: center; color: #444; font-size: 10px; font-weight: bold; display: flex; flex-direction: column; align-items: center; width: 25%; cursor: pointer; }
        .btn-icon { width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; margin-bottom: -3px; font-size: 22px; }
        .wa-c { color: #25D366; } .yt-c { color: #FF0000; } .sh-c { color: #0022bb; }
        .not-following .btn-icon { color: #ff0000; animation: sharp-blink 0.6s infinite ease-in-out; }
        #full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; display: none; overflow-y: auto; }
        .close-view { position: fixed; top: 15px; right: 15px; background: #ff0000; color: #fff; width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 20px; z-index: 2100; display: flex; justify-content: center; align-items: center; animation: sharp-blink 0.6s infinite ease-in-out; }
        .smooth-turn { transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 8px 16px; border-radius: 20px; display: none; z-index: 1000; font-size: 12px; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="top-header"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh2mta9Iy8-4mBSEIR9zBP3rQegrCAOnmCWv8AIs8Y1a9MYgBWIzg7IcajCAH_wmEXmfsyglaEELRXheyQFqlm-PHMmDpppi-aDuNEgCYEK5Dc_kSmjoFgoIyUpD44Ke26C3LzVrt00pD9VC00P5I7wgf8jssacWWdE3xbu609hb5qpOGh3NlKjyCPyn7yg/s1844/106383.png"></div>
    <div class="slider-viewport"><div id="slider-track"></div></div>
    <div class="bottom-actions" id="global-actions"></div>
</div>
<div id="full-view"><button class="close-view" onclick="closeFullNews()"><i class="fas fa-times"></i></button><div id="full-view-content" style="padding:15px; margin-top:40px;"></div></div>
<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyDQJ0x2mFZqoCgiE_34fg9WxomurFWoopg", authDomain: "newsbytes-848a9.firebaseapp.com", projectId: "newsbytes-848a9", storageBucket: "newsbytes-848a9.firebasestorage.app", messagingSenderId: "26695955001", appId: "1:26695955001:web:0c25b74d7a849f4a9d13e8" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let newsList = []; let currentIndex = 0;
    const track = document.getElementById("slider-track"); const bottomActions = document.getElementById("global-actions");
    onSnapshot(query(collection(db, "news"), orderBy("timestamp", "desc")), (snapshot) => {
        newsList = []; snapshot.forEach(doc => newsList.push({ id: doc.id, ...doc.data() })); renderCube();
    });
    function renderCube() {
        track.innerHTML = ""; const h = track.offsetHeight;
        newsList.forEach((data, index) => {
            const card = document.createElement("div"); card.className = "news-card";
            card.style.transform = `rotateX(${index * -90}deg) translateZ(${h / 2}px)`;
            const words = data.desc.split(/\s+/); let shortDesc = data.desc; let readMoreHtml = '';
            if (words.length > 80) { shortDesc = words.slice(0, 80).join(' ') + '...'; readMoreHtml = `<button class="read-more-btn" onclick="openFullNews(${index})">ఇంకా చదవండి...</button>`; }
            card.innerHTML = `<div class="news-media">${data.mediaType === 'video' ? `<video src="${data.mediaUrl}" loop muted playsinline></video>` : `<img src="${data.mediaUrl}">`}</div>
                <div class="news-content"><h2 class="news-title">${data.title}</h2><div class="news-desc">${shortDesc}</div>
                <div class="on-screen-actions">${readMoreHtml}<button class="screen-btn wa-c" onclick="goShare('${data.title.replace(/'/g,"")}')"><i class="fab fa-whatsapp"></i></button>
                <button class="screen-btn sh-c" onclick="goShare('${data.title.replace(/'/g,"")}')"><i class="fas fa-share-alt"></i></button></div></div>`;
            track.appendChild(card);
        });
        updateBottomActions(); updateRotation(0);
    }
    function updateBottomActions() {
        if (!newsList[currentIndex]) return; const data = newsList[currentIndex];
        bottomActions.innerHTML = `<button class="btn-action" onclick="goShare('${data.title.replace(/'/g,"")}')"><div class="btn-icon wa-c"><i class="fab fa-whatsapp"></i></div><span>వాట్సాప్</span></button>
            <button class="btn-action" onclick="window.open('https://www.youtube.com')"><div class="btn-icon yt-c"><i class="fab fa-youtube"></i></div><span>యూట్యూబ్</span></button>
            <button class="btn-action" onclick="goShare('${data.title.replace(/'/g,"")}')"><div class="btn-icon sh-c"><i class="fas fa-share-alt"></i></div><span>షేర్</span></button>
            <button class="btn-action not-following" onclick="handleBell()"><div class="btn-icon"><i class="fas fa-bell"></i></div><span>ఫాలో</span></button>`;
    }
    window.handleBell = () => { showToast("NB | ఫాలో అయ్యారు!"); };
    window.openFullNews = (index) => {
        const data = newsList[index]; document.getElementById("full-view-content").innerHTML = `<img src="${data.mediaUrl}" style="width:100%; border-radius:8px;"><h2 style="color:#ff0000; font-size:18px; margin-top:15px;">NB | ${data.title}</h2><div style="font-size:16px; line-height:1.7; color:#333;">${data.desc}</div>`;
        document.getElementById("full-view").style.display = "block";
    };
    window.closeFullNews = () => document.getElementById("full-view").style.display = "none";
    let startY = 0; let isMoving = false;
    function updateRotation(extraDeg) { track.style.transform = `translateZ(-${track.offsetHeight / 2}px) rotateX(${(currentIndex * 90) + extraDeg}deg)`; }
    document.addEventListener("touchstart", (e) => { startY = e.touches[0].clientY; track.classList.remove("smooth-turn"); isMoving = true; }, {passive: true});
    document.addEventListener("touchmove", (e) => { if (!isMoving) return; const deltaY = startY - e.touches[0].clientY; if (Math.abs(deltaY) > 15) updateRotation((deltaY / window.innerHeight) * 90); }, {passive: true});
    document.addEventListener("touchend", (e) => { if (!isMoving) return; isMoving = false; const deltaY = startY - e.changedTouches[0].clientY; track.classList.add("smooth-turn"); if (Math.abs(deltaY) > 60) { if (deltaY > 0 && currentIndex < newsList.length - 1) currentIndex++; else if (deltaY < 0 && currentIndex > 0) currentIndex--; updateBottomActions(); } updateRotation(0); });
    window.goShare = (title) => { const text = "NB | " + title + "\n\nవార్త ఇక్కడ చూడండి: " + window.location.href; if (navigator.share) { navigator.share({ title: 'News Bytes', text: text }).catch(console.error); } else { navigator.clipboard.writeText(text); showToast("NB | లింక్ కాపీ అయ్యింది ✓"); } };
    function showToast(msg) { const t = document.getElementById("toast"); t.innerText = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2500); }
</script>
</body>
</html>
